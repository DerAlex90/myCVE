name: mycve

x-app: &app
  image: mycve:local
  build: .
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  environment: &app-env
    MYCVE_DATABASE_URL: postgresql+psycopg://mycve:${POSTGRES_PASSWORD:?Run python scripts/configure.py first}@postgres:5432/mycve
    MYCVE_REDIS_URL: redis://redis:6379/0
    MYCVE_API_KEY: ${MYCVE_API_KEY:?Run python scripts/configure.py first}
    MYCVE_NVD_API_KEY: ${MYCVE_NVD_API_KEY:-}
    MYCVE_SYNC_INTERVAL_HOURS: ${MYCVE_SYNC_INTERVAL_HOURS:-6}
    MYCVE_BSI_MAX_DOCUMENTS: ${MYCVE_BSI_MAX_DOCUMENTS:-50}
    MYCVE_AGENT_STALE_HOURS: ${MYCVE_AGENT_STALE_HOURS:-24}
    MYCVE_AGENT_REPORT_INTERVAL_SECONDS: ${MYCVE_AGENT_REPORT_INTERVAL_SECONDS:-21600}
    MYCVE_AGENT_MAX_SNAPSHOTS_PER_MINUTE: ${MYCVE_AGENT_MAX_SNAPSHOTS_PER_MINUTE:-10}
    MYCVE_SCAN_CACHE_HOURS: ${MYCVE_SCAN_CACHE_HOURS:-6}
    MYCVE_IDENTIFICATION_MAX_QUERIES: ${MYCVE_IDENTIFICATION_MAX_QUERIES:-50}
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mycve
      POSTGRES_DB: mycve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/configure.py first}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycve -d mycve"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
  api:
    <<: *app
    command: ["api"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
  worker:
    <<: *app
    command: ["celery", "-A", "mycve.server.tasks:celery", "worker", "--loglevel=INFO", "--concurrency=1"]
    depends_on:
      api: { condition: service_healthy }
  beat:
    <<: *app
    command: ["celery", "-A", "mycve.server.tasks:celery", "beat", "--loglevel=INFO", "--schedule=/data/celerybeat-schedule"]
    volumes: ["beat_data:/data"]
    depends_on:
      api: { condition: service_healthy }
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      MYCVE_SITE_ADDRESS: ${MYCVE_SITE_ADDRESS:-http://localhost}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},api
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1},api
    ports:
      - "${MYCVE_BIND_ADDRESS:-127.0.0.1}:${MYCVE_HTTP_PORT:-8080}:80"
      - "${MYCVE_BIND_ADDRESS:-127.0.0.1}:${MYCVE_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  beat_data:
  caddy_data:
  caddy_config:
